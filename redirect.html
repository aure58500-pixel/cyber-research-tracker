<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Research Lab</title>

<style>
body{
  margin:0;
  background:#080c11;
  color:#f5f7fa;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.box{
  width:min(600px,calc(100% - 40px));
  padding:35px;
  background:#101720;
  border-radius:15px;
  box-sizing:border-box;
  text-align:center;
}

h1{
  margin-top:0;
}

p{
  line-height:1.6;
  color:#c7d0da;
}

button{
  background:#2563eb;
  border:0;
  border-radius:8px;
  padding:14px 22px;
  color:white;
  cursor:pointer;
  font-size:16px;
}

button:disabled{
  opacity:.5;
  cursor:wait;
}

#status{
  margin-top:20px;
  padding:15px;
  background:#080c11;
  border-radius:8px;
  line-height:1.5;
}
</style>

</head>

<body>

<div class="box">

<h1>Cyber Research Lab</h1>

<p>
Vous allez participer à une expérience de recherche.
</p>

<p>
Avec votre autorisation, cette expérience peut demander
l'accès à votre caméra et à votre position.
Vous pouvez refuser ces autorisations.
</p>

<button id="startButton">
J'accepte et je commence
</button>

<div id="status">
En attente de votre choix.
</div>

</div>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyCl_prq8KKEuBDHuCKLYlA3_hLbxt4USY0",
  authDomain: "cyber-research-tracker.firebaseapp.com",
  projectId: "cyber-research-tracker",
  storageBucket: "cyber-research-tracker.firebasestorage.app",
  messagingSenderId: "152454180016",
  appId: "1:152454180016:web:a0bdbd513a8d5b7aecdf75"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const button = document.getElementById("startButton");
const status = document.getElementById("status");

const params = new URLSearchParams(window.location.search);

const experimentId =
  params.get("id") || crypto.randomUUID();

const destination =
  params.get("destination");


button.addEventListener("click", startResearch);


async function startResearch(){

  button.disabled = true;

  let cameraGranted = false;
  let locationGranted = false;

  let latitude = null;
  let longitude = null;

  status.textContent =
    "Début de l'expérience…";


  /*
   * ÉTAPE 1 — CAMÉRA
   */

  try{

    status.textContent =
      "Demande d'autorisation de caméra…";

    if(navigator.mediaDevices?.getUserMedia){

      const stream =
        await navigator.mediaDevices.getUserMedia({
          video:true
        });

      cameraGranted = true;

      /*
       * IMPORTANT :
       * on arrête immédiatement la caméra.
       */

      stream.getTracks().forEach(track=>{
        track.stop();
      });

    }

  }catch(error){

    console.log(
      "Caméra refusée ou indisponible",
      error
    );

  }


  /*
   * ÉTAPE 2 — LOCALISATION
   */

  try{

    status.textContent =
      "Demande d'autorisation de localisation…";

    if(navigator.geolocation){

      const position =
        await new Promise((resolve,reject)=>{

          navigator.geolocation.getCurrentPosition(
            resolve,
            reject,
            {
              enableHighAccuracy:true,
              timeout:5000,
              maximumAge:0
            }
          );

        });

      locationGranted = true;

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;

    }

  }catch(error){

    console.log(
      "Localisation refusée ou indisponible",
      error
    );

  }


  /*
   * ÉTAPE 3 — ENREGISTREMENT
   */

  try{

    status.textContent =
      "Enregistrement de l'expérience…";


    await addDoc(
      collection(db,"research-events"),
      {

        experimentId,

        type:"research",

        cameraGranted,

        locationGranted,

        latitude:
          locationGranted
            ? latitude
            : null,

        longitude:
          locationGranted
            ? longitude
            : null,

        timestamp:
          new Date().toISOString()

      }
    );


    /*
     * L'EXPÉRIENCE EST TERMINÉE.
     */

    status.textContent =
      "✓ Expérience terminée.";


    /*
     * Redirection après 1 seconde.
     */

    setTimeout(()=>{

      if(destination){

        window.location.href =
          destination;

      }else{

        status.textContent =
          "✓ Expérience terminée. Vous pouvez fermer cette page.";

        button.disabled = false;

      }

    },1000);


  }catch(error){

    console.error(error);

    status.textContent =
      "Erreur Firebase : " +
      (error?.message || error);

    button.disabled = false;

  }

}

</script>

</body>
</html>
